apiVersion: v1
kind: Pod
metadata:
  name: simple-pod-1
  namespace: audit-zone
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: alpine
      image: alpine:latest
      command: ["sh", "-c", "echo 'Container 1 running' && sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL